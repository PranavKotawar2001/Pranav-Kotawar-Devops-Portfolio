# ─────────────────────────────────────────────
# Service — Exposes the portfolio pod(s)
# ─────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: portfolio-service
  namespace: default
  labels:
    app: portfolio
spec:
  type: LoadBalancer       # Change to ClusterIP if using Ingress
  selector:
    app: portfolio
  ports:
    - name: http
      protocol: TCP
      port: 80             # External port
      targetPort: 5000     # Container port

---
# ─────────────────────────────────────────────
# Secret — Sensitive config values
# ─────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: portfolio-secret
  namespace: default
type: Opaque
stringData:
  secret-key: "pranav-kotawar-k8s-secret-2025"   # Change before production!

---
# ─────────────────────────────────────────────
# ConfigMap — Non-sensitive env config
# ─────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-config
  namespace: default
data:
  FLASK_DEBUG: "false"
  PORT: "5000"
  PORTFOLIO_NAME: "Pranav Kotawar"
  PORTFOLIO_TITLE: "Junior DevOps Engineer"
  PORTFOLIO_EMAIL: "pranavkotawar@outlook.com"
  PORTFOLIO_PHONE: "+91-7972758711"
  PORTFOLIO_GITHUB: "https://github.com/PranavKotawar2001"
  PORTFOLIO_LOCATION: "Nagpur, Maharashtra, India"
  PORTFOLIO_AVAILABILITY: "Open to Remote"

---
# ─────────────────────────────────────────────
# HPA — Auto-scale 2–6 replicas on CPU load
# ─────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: portfolio-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: portfolio-deployment
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
