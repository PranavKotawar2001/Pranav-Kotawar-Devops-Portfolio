apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-deployment
  namespace: default
  labels:
    app: portfolio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1 # Allow 1 extra pod during update
      maxUnavailable: 0 # Zero downtime — never kill before new is ready
  template:
    metadata:
      labels:
        app: portfolio
    spec:
      containers:
        - name: portfolio
          image: pranavkotawar/portfolio:latest # Replace with your DockerHub/ECR image
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http

          # ── Environment Variables ──
          env:
            - name: FLASK_DEBUG
              value: "false"
            - name: PORT
              value: "5000"
            - name: PORTFOLIO_NAME
              value: "Pranav Kotawar"
            - name: PORTFOLIO_TITLE
              value: "Junior DevOps Engineer"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: portfolio-secret
                  key: secret-key

          # ── Resource Limits ──
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"

      # ── Restart Policy ──
      restartPolicy: Always
