apiVersion: v1
kind: Service
metadata:
  name: portfolio-service
  namespace: default
  labels:
    app: portfolio
spec:
  type: LoadBalancer # Change to ClusterIP if using Ingress
  selector:
    app: portfolio
  ports:
    - name: http
      protocol: TCP
      port: 80 # External port
      targetPort: 5000 # Container port
